<text x="30" y="285" font-size="16" font-weight="bold">Read the sound</text>
<text x="30" y="311" font-size="14">B / blue → gold: dark → bright. N / more dots: tonal → noise-like. Values 0–100; transitions are linear.</text>
<text x="30" y="336" font-size="14">Left slope: entrance time. Right slope: release time. Empty space: silence. Height is fixed, not loudness.</text>
<text x="30" y="361" font-size="13">The stored score also carries pitch, gain, and decay. This visual projection alone does not encode every synthesis parameter.</text>
